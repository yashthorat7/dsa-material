<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F87171" />
            <stop offset="50%" stop-color="#34D399" />
            <stop offset="100%" stop-color="#FB923C" />
        </linearGradient>
    </defs>

    <!-- connecting circular ring -->
    <circle cx="50" cy="55.5" r="37.5" fill="none" stroke="url(#ringGrad)" stroke-width="11" stroke-linecap="round" />

    <!-- 3 solid colored node circles (rotated: red on top) -->
    <!-- top node (red / hard) -->
    <circle cx="50" cy="18" r="15.5" fill="#F87171" />

    <!-- bottom right node (green / easy) -->
    <circle cx="82.48" cy="74.25" r="15.5" fill="#34D399" />

    <!-- bottom left node (orange / medium) -->
    <circle cx="17.52" cy="74.25" r="15.5" fill="#FB923C" />
</svg>
