<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DSA Guide</title>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme') || 'dark';
                document.documentElement.classList.add(theme === 'light' ? 'light-theme' : 'dark-theme');
            } catch (e) {}
        })();
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme') || 'dark';
                document.body.classList.add(theme === 'light' ? 'light-theme' : 'dark-theme');
            } catch (e) {}
        })();
    </script>
    <div class="header-trigger-zone">
        <div class="floating-controls-container">
            <button id="back-btn" class="minimal-back-circle" style="display: none;" aria-label="Go back">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="floating-controls-right">
                <div class="floating-capsule">
                    <button id="home-btn" class="icon-btn" aria-label="Home"><i class="fa-solid fa-house"></i></button>
                    <button id="tracker-btn" class="icon-btn" aria-label="Problem tracker"><i class="fa-solid fa-circle-check"></i></button>
                    <button id="cs-btn" class="icon-btn" aria-label="Cheat sheet"><i class="fa-solid fa-scroll"></i></button>
                </div>
                <button id="theme-toggle" class="minimal-circle-btn" aria-label="Toggle theme">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <main class="main-content">
            <div id="markdown-container" class="markdown-body"></div>
        </main>
    </div>

    <div id="tracker-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="smart-tracker-toolbar">
                <div class="toolbar-search-row">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="search-input" class="minimal-search" placeholder="Search problems, topics, patterns, companies...">
                        <button id="search-clear-btn" class="search-clear-btn" style="display: none;" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <button id="mobile-filter-toggle" class="mobile-filter-btn" aria-label="Toggle filters">
                        <i class="fa-solid fa-sliders"></i>
                        <span id="filter-indicator-dot" class="filter-indicator-dot" style="display: none;"></span>
                    </button>
                    <div class="tracker-progress-card">
                        <div class="progress-stats">
                            <span class="progress-title">Progress</span>
                            <span class="progress-fraction"><strong id="stat-solved">0</strong> / <span id="stat-total">0</span></span>
                        </div>
                        <div class="progress-bar-track">
                            <div id="tracker-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
                <div id="toolbar-collapsible-filters" class="toolbar-filters-row">
                    <div class="filter-segment status-segment">
                        <button class="filter-chip chip-solved active" data-filter="solved" aria-label="Toggle Solved">
                            <span class="status-marker solved"><i class="fa-solid fa-check"></i></span>
                            <span class="chip-text">Solved</span>
                        </button>
                        <button class="filter-chip chip-progress active" data-filter="progress" aria-label="Toggle In Progress">
                            <span class="status-marker progress"><i class="fa-solid fa-minus"></i></span>
                            <span class="chip-text">Progress</span>
                        </button>
                        <button class="filter-chip chip-todo active" data-filter="todo" aria-label="Toggle Todo">
                            <span class="status-marker todo"></span>
                            <span class="chip-text">Todo</span>
                        </button>
                    </div>
                    <div class="filter-segment diff-segment">
                        <button class="diff-chip diff-easy active" data-diff="Easy" aria-label="Toggle Easy">
                            <span class="diff-circle easy"></span>
                            <span class="diff-text">Easy</span>
                        </button>
                        <button class="diff-chip diff-medium active" data-diff="Medium" aria-label="Toggle Medium">
                            <span class="diff-circle medium"></span>
                            <span class="diff-text">Med</span>
                        </button>
                        <button class="diff-chip diff-hard active" data-diff="Hard" aria-label="Toggle Hard">
                            <span class="diff-circle hard"></span>
                            <span class="diff-text">Hard</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="problems-table-container">
                <table class="problems-table">
                    <thead>
                        <tr>
                            <th class="col-status"></th>
                            <th class="col-problem">Problem</th>
                            <th class="col-diff">Diff</th>
                            <th class="col-comp">Comp</th>
                            <th class="col-soln">Soln</th>
                        </tr>
                    </thead>
                    <tbody id="problems-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script type="module" src="assets/scripts/script.js"></script>
</body>
</html>
